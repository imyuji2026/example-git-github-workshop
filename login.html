<!DOCTYPE html>
<html>
<head>
    <title>Login - ABC College</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .login {
            background-color: white;
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            box-shadow: 0 2px 8px gray;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1e3a8a;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Student Login</h1>

    <form>

        <input
            type="email"
            placeholder="Enter Email"
            required
        >

        <input
            type="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
